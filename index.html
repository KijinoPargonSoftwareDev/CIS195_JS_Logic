<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        input, select {
            padding: 10px;
            margin: 5px;
        }

        #movieList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .movie {
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            background-color: #fafafa;
        }

        #message {
            padding: 10px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 Movie Explorer</h1>
        <p>Explore my movie collection!</p>
    </header>


    <!-- Movie Collection -->
    <section>
        <h2>My Movies</h2>

        <div id="movieList">
            <!-- JavaScript will put movies here -->
        </div>
    </section>


    <!-- Search / Filter -->
    <section>
        <h2>Find a Movie</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Enter a movie title"
        >

        <button id="searchButton">Search</button>
        <button id="showAllButton">Show All</button>

        <br>
    </section>


    <!-- Add Movie -->
    <section>
        <h2>Add a Movie</h2>

        <input
            type="text"
            id="titleInput"
            placeholder="Movie title"
        >

        <button id="addButton">Add Movie</button>
    </section>


    <!-- Array Controls -->
    <section>
        <h2>Collection Controls</h2>

        <button id="firstButton">Remove First</button>
        <button id="lastButton">Remove Last</button>
    </section>

    <script src="script.js"></script>

</body>
</html>
